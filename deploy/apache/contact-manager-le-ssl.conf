<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName poosd.dev
    ServerAlias www.poosd.dev

    DocumentRoot /var/www/contact-manager/current/public

    <Directory /var/www/contact-manager/current/public>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>

    <Directory /var/www/contact-manager/current/public/api>
        FallbackResource /api/index.php
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/contact-manager-error.log
    CustomLog ${APACHE_LOG_DIR}/contact-manager-access.log combined

Include /etc/letsencrypt/options-ssl-apache.conf
ServerAlias colors.poosd.dev
SSLCertificateFile /etc/letsencrypt/live/poosd.dev/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/poosd.dev/privkey.pem
</VirtualHost>
</IfModule>
