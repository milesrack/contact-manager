<VirtualHost *:443>
    ServerName contact-manager.poosd.dev
    DocumentRoot /var/www/contact-manager/current/public

    <Directory /var/www/contact-manager/current/public>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>

    <Directory /var/www/contact-manager/current/public/api>
        FallbackResource /api/index.php
    </Directory>

    SSLEngine on
    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/zetafly.poosd.dev/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/zetafly.poosd.dev/privkey.pem

    ErrorLog ${APACHE_LOG_DIR}/contact-manager-error.log
    CustomLog ${APACHE_LOG_DIR}/contact-manager-access.log combined
</VirtualHost>
