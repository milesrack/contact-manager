<VirtualHost *:80>
    ServerName contact-manager.poosd.dev
    Alias /.well-known/acme-challenge/ /var/www/letsencrypt/.well-known/acme-challenge/
    <Directory /var/www/letsencrypt>
        Require all granted
    </Directory>
    RedirectMatch permanent ^/(?!\.well-known/acme-challenge/)(.*)$ https://contact-manager.poosd.dev/$1
</VirtualHost>
